name: Build Windows (AI notification filter)

on:
  workflow_dispatch:

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 350
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install VS ATL & MFC for the v143 14.44 toolset
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          Write-Host "Visual Studio at: $vsPath"
          $setup = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          $proc = Start-Process -FilePath $setup -Wait -PassThru -ArgumentList @(
            'modify', '--installPath', "`"$vsPath`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.ATL',
            '--add', 'Microsoft.VisualStudio.Component.VC.14.44.17.14.MFC',
            '--quiet', '--norestart')
          Write-Host "Installer exit code: $($proc.ExitCode)"
          if ($proc.ExitCode -notin 0, 3010) { exit $proc.ExitCode }

      - name: Verify ATL headers for the build toolset (self-heal)
        shell: powershell
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = (& $vswhere -latest -products * -property installationPath | Select-Object -First 1).Trim()
          $msvcRoot = Join-Path $vsPath "VC\Tools\MSVC"
          $toolsets = @(Get-ChildItem $msvcRoot -Directory | Where-Object { Test-Path (Join-Path $_.FullName "bin\HostX64\x64\cl.exe") })
          $withAtl = @($toolsets | Where-Object { Test-Path (Join-Path $_.FullName "atlmfc\include\atlbase.h") })
          Write-Host "Toolsets: $($toolsets.Name -join ', ')"
          Write-Host "With ATL: $($withAtl.Name -join ', ')"
          if ($withAtl.Count -eq 0) {
            Write-Host "##[error]ATL was not installed for any toolset"
            exit 1
          }
          foreach ($t in $toolsets) {
            if (-not (Test-Path (Join-Path $t.FullName "atlmfc\include\atlbase.h"))) {
              $src = Join-Path $withAtl[0].FullName "atlmfc"
              $dst = Join-Path $t.FullName "atlmfc"
              Write-Host "Copying atlmfc from $src to $dst"
              robocopy $src $dst /E /NFL /NDL /NJH /NJS | Out-Null
              if ($LASTEXITCODE -ge 8) { exit $LASTEXITCODE }
            }
          }
          Write-Host "ATL available for all toolsets."
          exit 0

      - name: Setup MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          toolset: 14.44

      - name: Restore built libraries cache (Qt, FFmpeg, OpenSSL, ...)
        uses: actions/cache/restore@v4
        id: libraries-cache
        with:
          path: ${{ runner.workspace }}/Libraries
          key: ayugram-libs-${{ runner.os }}-msvc-14.44-${{ hashFiles('Telegram/build/prepare/prepare.py', 'Telegram/build/prepare/win.bat', 'Telegram/build/qt_version.py') }}

      - name: Prepare and build libraries
        shell: cmd
        run: Telegram\build\prepare\win.bat

      - name: Save built libraries cache
        if: steps.libraries-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.workspace }}/Libraries
          key: ${{ steps.libraries-cache.outputs.cache-primary-key }}

      - name: Disable MSVC multi-process compilation for the app
        shell: powershell
        run: |
          $options = Join-Path $env:GITHUB_WORKSPACE 'cmake\options_win.cmake'
          $content = [System.IO.File]::ReadAllText($options)
          $pattern = '(?m)^([ \t]*)/MP[ \t]*# Enable multi process build\.'
          $updated = [regex]::Replace($content, $pattern, '$1# /MP disabled to keep compiler memory bounded.', 1)
          if ($updated -eq $content) {
            throw 'Could not find the expected MSVC /MP option in cmake/options_win.cmake.'
          }
          [System.IO.File]::WriteAllText($options, $updated, (New-Object System.Text.UTF8Encoding($false)))
          Write-Host 'Removed the generated app /MP option.'

      - name: Configure (cmake, VS generator)
        working-directory: Telegram
        shell: cmd
        run: configure.bat x64 -D TDESKTOP_API_ID=2040 -D TDESKTOP_API_HASH=b18441a1ff607e10a989891a5462e627 "-DCMAKE_CXX_FLAGS_RELEASE=/Od /Ob0 /DNDEBUG" "-DCMAKE_C_FLAGS_RELEASE=/Od /DNDEBUG"

      - name: Verify memory-conscious Release flags
        shell: powershell
        run: |
          $cache = Join-Path $env:GITHUB_WORKSPACE 'out\CMakeCache.txt'
          foreach ($language in @('C', 'CXX')) {
            $expected = if ($language -eq 'CXX') {
              'CMAKE_CXX_FLAGS_RELEASE:STRING=/Od /Ob0 /DNDEBUG'
            } else {
              'CMAKE_C_FLAGS_RELEASE:STRING=/Od /DNDEBUG'
            }
            if (-not (Select-String -Path $cache -SimpleMatch $expected -Quiet)) {
              throw "Expected Release flags not found in CMake cache: $expected"
            }
            Write-Host $expected
          }

      - name: Build AyuGram.exe
        shell: powershell
        env:
          CL_MPCount: 1
        run: |
          $buildOutput = Join-Path $env:RUNNER_TEMP 'ayugram-build.log'
          $maxAttempts = 3
          for ($attempt = 1; $attempt -le $maxAttempts; $attempt++) {
            Write-Host "Build attempt $attempt of $maxAttempts"
            & cmake --build out --config Release --parallel 1 -- /m:1 /p:MultiProcessorCompilation=false 2>&1 |
              Tee-Object -FilePath $buildOutput
            $buildExitCode = $LASTEXITCODE
            if ($buildExitCode -eq 0) {
              exit 0
            }
            $errorCodes = @(
              (Select-String -Path $buildOutput -Pattern 'error C(\d+)') |
                ForEach-Object { $_.Matches[0].Groups[1].Value } |
                Sort-Object -Unique
            )
            $memoryErrorCodes = @('1060', '1076', '3859')
            $unexpectedErrors = @(
              $errorCodes | Where-Object { $_ -notin $memoryErrorCodes }
            )
            if ($unexpectedErrors.Count -gt 0) {
              Write-Host "##[error]Build reported non-memory compiler errors: $($unexpectedErrors -join ', ')."
              exit $buildExitCode
            }
            $hasOutOfMemory = Select-String -Path $buildOutput -Pattern 'out of memory|not enough memory' -Quiet
            if ($errorCodes.Count -eq 0 -and -not $hasOutOfMemory) {
              Write-Host "##[error]Build failed with exit code $buildExitCode; not a recognized compiler memory failure."
              exit $buildExitCode
            }
            if ($attempt -eq $maxAttempts) {
              Write-Host "##[error]Compiler memory failure persisted after $maxAttempts attempts."
              exit $buildExitCode
            }
            Write-Warning 'Compiler reported memory exhaustion; retrying incrementally so completed objects are reused.'
          }

      - name: Upload AyuGram.exe
        uses: actions/upload-artifact@v4
        with:
          name: AyuGram-Windows-x64
          path: out/Release/AyuGram.exe
          if-no-files-found: error
